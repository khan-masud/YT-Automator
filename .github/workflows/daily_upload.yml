name: Daily YouTube Automation Pipeline

on:
  schedule:
    # Triggers daily at 12:00 UTC (6:00 PM BST)
    - cron: '0 12 * * *'
  push:
    branches: [ main, master ]
  workflow_dispatch: # Enables manual trigger button on GitHub UI

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Environment & Secret Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python setup_secrets.py

      - name: Execute Daily Video Pipeline
        run: |
          python main.py
