name: Happy Little Stars Pipeline (Manual Only)

on:
  workflow_dispatch: # Manual runs only; no scheduled or push-triggered publishing

jobs:
  generate-and-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Configure Safe Test Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPLOAD_TO_YOUTUBE: 'false'
          DAILY_SHORTS_COUNT: '1'
          DAILY_LONGFORM_COUNT: '0'
          YOUTUBE_PRIVACY_STATUS: 'private'
        run: python setup_secrets.py

      - name: Generate One Short (Upload Disabled)
        env:
          UPLOAD_TO_YOUTUBE: 'false'
          DAILY_SHORTS_COUNT: '1'
          DAILY_LONGFORM_COUNT: '0'
        run: python main.py

      - name: Save Video, Captions, Voiceover, Logs, and Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-little-stars-test-output
          path: |
            output/**/*.mp4
            output/**/*.srt
            output/**/*.mp3
            logs/**
            data/yt_automator.db
          if-no-files-found: warn
          retention-days: 7
